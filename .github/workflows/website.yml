name: Publish website

on:
  push:
    branches: [main]
    paths: ['website/**', 'tests/Website/**', 'install.ps1', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check website
        run: node --test tests/Website/*.test.mjs
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p artifacts/website-public
          cp -R website/. artifacts/website-public/
          cp install.ps1 artifacts/website-public/install.ps1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/website-public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
